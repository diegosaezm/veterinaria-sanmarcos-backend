spring.application.name=sanmarcos

# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_sanmarcos
spring.datasource.username=sanmarcos_app
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true